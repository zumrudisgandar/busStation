<div class="row">
    <div class="col-md-8 mx-auto rounded border p-4 m-4">
        <h2 class="text-center mb-5">Login</h2>
        <form th:action="@{/admin/auth/login}" method="POST">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <label class="col-sm-4 col-form-label"> Username: <input type="text" name="username"/> </label>
            </div>
            <div class="offset-sm-4 col-sm-4 d-grid">
                <label class="col-sm-4 col-form-label"> Password: <input type="password" name="password"/> </label>
            </div>
            <div class="offset-sm-4 col-sm-4 d-grid">
                <input type="submit" class="btn btn-primary" value="Login"/>
            </div>
            <div th:if="${param.error}">
                Invalid username and password.
            </div>
            <div th:if="${param.logout}">
                You have been logged out.
            </div>
        </form>
    </div>
</div>
