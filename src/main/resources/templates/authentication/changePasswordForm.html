<!doctype html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title>Reset Password</title>

</head>
<body>
<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/stations}">Stations</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
<div class="row">
    <div class="col-md-8 mx-auto rounded border p-4 m-4">
        <h2 class="text-center mb-5">Reset Password</h2>
        <form th:action="@{/forgotPassword/changePassword}" method="POST">
            <input type="hidden" name="email" th:value="${email}">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <label class="col-sm-4 col-form-label"> New Password: <input type="password" name="password" required/> </label>
            </div>
            <div class="offset-sm-4 col-sm-4 d-grid">
                <label class="col-sm-4 col-form-label"> Confirm Password: <input type="password" name="repeatPassword" required/> </label>
            </div>
            <div class="offset-sm-4 col-sm-4 d-grid">
                <input type="submit" class="btn btn-primary" value="Reset Password"/>
            </div>
            <div th:if="${message}" class="alert alert-danger mt-3">
                <p th:text="${message}"></p>
            </div>
        </form>
    </div>
</div>
</body>
</html>
