<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bus Station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMj/mW5aGZ9/OOS9Qv/pH0FVfG9H2lrFdlK3e6r" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/43124feaf5.js" crossorigin="anonymous"></script>
</head>
<body>
<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/stations">Bus Station</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}" sec:authorize="isAuthenticated()">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <a href="/stations" class="text-decoration-none">
        <h1 class="text-container my-4">Stations</h1>
    </a>
    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="btn btn-primary mb-3" href="/stations/create">Create Station</a>
<!--    <a class="btn btn-primary mb-3" href="/courses/create">Create Course</a>-->
    <!-- Search form -->
    <form action="/stations/search" method="GET" class="mb-3">
        <div class="input-group">
            <label for="searchCriteria" class="input-group-text">Search Criteria:</label>
            <select id="searchCriteria" name="searchCriteria" class="form-select">
                <option value="routeName">Route Name</option>
                <option value="stationLocation">Station Location</option>
                <option value="arrivalTime">Arrival Time</option>
            </select>
            <input type="text" class="form-control" placeholder="Enter search option" name="input">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>
    <!-- Sorting -->
    <div>
        <button type="button" class="btn btn-primary" data-bs-toggle="dropdown" aria-expanded="false">
            Sort
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/stations/sort?field=stationID">ID</a></li>
            <li><a class="dropdown-item" href="/stations/sort?field=routeName">Route Name</a></li>
            <li><a class="dropdown-item" href="/stations/sort?field=stationLocation">Station Location</a></li>
            <li><a class="dropdown-item" href="/stations/sort?field=arrivalTime">Arrival Time</a></li>
        </ul>
    </div>
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Arrival Time</th>
            <th>Departure Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="station : ${stations}">
            <td th:text="${station.stationID}"></td>
            <td th:text="${station.routeName}"></td>
            <td th:text="${station.stationLocation}"></td>
            <td th:text="${station.arrivalTime}"></td>
            <td th:text="${station.departureTime}"></td>
            <td style="white-space:nowrap">
                <a class="btn btn-info btn-sm" th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                   th:href="@{/stations/edit(id = ${station.stationID})}"> <i class="fa-solid fa-pen-to-square"></i></a>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- Pagination -->
    <div th:if="${not (errorMessage != null or page.empty)}">
        <ul class="pagination">
            <li class="${page.first ? 'page-item disabled' : 'page-item'}">
                <a class="page-link" th:href="@{'?page=' + ${page.number - 1}}">&laquo;</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:class="${page.number == i ? 'page-item active' : 'page-item'}">
                <a class="page-link" th:href="@{'?page=' + ${i}}" th:text="${i + 1}">${i + 1}</a>
            </li>
            <li class="{page.last ? 'page-item disabled' : 'page-item'}">
                <a class="page-link" th:if="${not page.last}" th:href="@{'?page=' + ${page.number + 1}}">&raquo;</a>
            </li>
        </ul>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
