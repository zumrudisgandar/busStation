<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto rounded border p-4 m-4">
            <h2 class="text-center mb-5">New Station</h2>
            <form method="post" enctype="multipart/form-data" th:object="${stationDTO}">
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Route Name</label>
                    <div class="col-sm-8">
                        <input class="form-control" th:field="${stationDTO.routeName}">
                        <p th:if="${#fields.hasErrors('routeName')}" th:errorclass="text-danger"
                           th:errors="${stationDTO.routeName}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Station Location</label>
                    <div class="col-sm-8">
                        <input class="form-control" th:field="${stationDTO.stationLocation}">
                        <p th:if="${#fields.hasErrors('stationLocation')}" th:errorclass="text-danger"
                           th:errors="${stationDTO.stationLocation}"></p>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Arrival Time</label>
                    <div class="col-sm-8">
                        <input class="form-control" th:field="${stationDTO.arrivalTime}">
                        <p th:if="${#fields.hasErrors('arrivalTime')}" th:errorclass="text-danger"
                           th:errors="${stationDTO.arrivalTime}"></p>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Departure Time</label>
                    <div class="col-sm-8">
                        <input class="form-control" th:field="${stationDTO.departureTime}">
                        <p th:if="${#fields.hasErrors('departureTime')}" th:errorclass = "text-danger"
                           th:errors="${stationDTO.departureTime}"></p>
                    </div>
                </div>
                <div class="row">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                    <div class="col-sm-4 d-grid">
                        <a class="btn btn-outline-primary" href="/stations" role="button">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
